name: Legacy Godot Android prototype
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          echo '02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          echo '1998af37f1387684e2c211cdb483daf492fc64dc6b12096bddcdca25b6910c86  /tmp/templates.tpz' | sha256sum --check
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -j -q /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Configure native Android export
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/android-tools.zip
          echo '7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  /tmp/android-tools.zip' | sha256sum --check
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q /tmp/android-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdk_manager" --sdk_root="$ANDROID_HOME" --licenses > /tmp/android-licenses.log
          "$sdk_manager" --sdk_root="$ANDROID_HOME" 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35' 
          mkdir -p "$HOME/.config/godot" build
          python3 - <<'PY'
          import os
          from pathlib import Path
          settings = '[gd_resource type="EditorSettings" format=3]\n[resource]\n'
          settings += f'export/android/java_sdk_path = "{os.environ["JAVA_HOME"]}"\n'
          settings += f'export/android/android_sdk_path = "{os.environ["ANDROID_HOME"]}"\n'
          (Path.home()/'.config/godot/editor_settings-4.5.tres').write_text(settings)
          PY
      - name: Import and test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --import --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/import.log; then exit 1; fi
          XDG_DATA_HOME="$RUNNER_TEMP/kesho-tests" godot --headless --script res://tests/test_life.gd 2>&1 | tee /tmp/tests.log
          if grep -E 'SCRIPT ERROR|FAIL:|Parse Error' /tmp/tests.log; then exit 1; fi
          timeout 60s env XDG_DATA_HOME="$RUNNER_TEMP/kesho-touch" godot --headless --script res://tests/test_touch.gd 2>&1 | tee /tmp/touch-tests.log
          if grep -E 'SCRIPT ERROR|FAIL:|Parse Error|^ERROR:' /tmp/touch-tests.log; then exit 1; fi
      - name: Export signed test APK
        run: godot --headless --export-debug Android build/Kesho-Prototype.apk
      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/Kesho-Prototype.apk
          sha256sum build/Kesho-Prototype.apk > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Kesho-Android-test-build
          path: |
            build/Kesho-Prototype.apk
            build/SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
